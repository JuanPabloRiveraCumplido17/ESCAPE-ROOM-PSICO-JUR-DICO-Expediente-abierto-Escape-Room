const N=Q.length,P=["#2f5d50","#7a2e2e","#2f4a7a","#6b4a2a"],SC=["#2f7d4f","#b8860b","#9b2c2c"];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db=null,uid=null,owner=false,rows=[],me={name:"",level:0,score:0},qi=0,wrong=0,busy=false,sure=false,door=null;
const room=$("#room");
document.addEventListener("pointermove",e=>{const s=document.documentElement.style;s.setProperty("--mx",e.clientX+"px");s.setProperty("--my",e.clientY+"px")});
const save=async()=>{if(!db||!uid)return;try{await db.doc("players/"+uid).set({name:me.name,level:me.level,score:me.score,t:Date.now()})}catch(e){}};
function view(v){["play","board","admin"].forEach(x=>$("#"+x).hidden=x!==v);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.v)view(b.dataset.v)};
$("#go").onclick=async()=>{const n=$("#nm").value.trim().replace(/\s+/g," ");if(n.length<2){$("#msg").textContent="Escribe tu nombre (mínimo 2 letras).";return}
 me.name=n;qi=me.level||0;if(audio()){AC.resume();music()}await save();$("#reg").hidden=true;ask()};
function ask(){if(qi>=N)return fin();const [r,t,p,o]=Q[qi];wrong=0;busy=false;room.dataset.r=r;
 $("#game").hidden=false;$("#end").hidden=true;$("#fb").innerHTML="";$("#md").hidden=true;
 $("#rm").textContent="Puerta "+(r+1)+" · "+R[r][0];$("#pg").textContent="Reto "+(qi+1)+"/"+N;$("#sc").textContent="⭐ "+me.score+" pts";
 $("#intro").textContent=(qi===0||Q[qi-1][0]!==r)?R[r][1]:"";$("#ty").textContent=t;$("#q").textContent=p;
 const ord=o.map((_,i)=>i);if(t!==S)ord.sort(()=>Math.random()-.5);
 $("#ds").className="doors"+(t===S?" s3":"");
 $("#ds").innerHTML=ord.map((oi,k)=>`<div class="door" role="button" tabindex="0" data-i="${oi}" style="--c:${t===S?SC[oi]:P[k%4]}"><span class="light"></span><span class="leaf"><i class="num">${k+1}</i><b class="txt">${esc(o[oi])}</b><i class="knob"></i></span></div>`).join("")}
$("#ds").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.target.click()}};
$("#ds").onclick=e=>{const b=e.target.closest(".door");if(!b||busy||b.classList.contains("locked"))return;const x=Q[qi][5];
 if(+b.dataset.i===Q[qi][4]){busy=true;door=b;b.classList.add("open");win();const pts=Math.max(1,3-wrong);me.score+=pts;me.level=qi+1;save();
  setTimeout(()=>{$("#sc").textContent="⭐ "+me.score+" pts";$("#md").hidden=false;$("#md").innerHTML=`<div class="sheet"><h3>🚪✨ ¡Puerta abierta! +${pts} pts</h3><p>${x}</p><button id="nx">${qi+1<N?"Cruzar la puerta →":"Ver resultado"}</button></div>`;$("#nx").onclick=cross},900)}
 else{wrong++;bad();b.classList.add("locked");$("#fb").innerHTML='<p class="bad">🔒 Esa puerta está cerrada con llave. Razónalo y prueba otra.</p>'}};
function cross(){$("#md").hidden=true;if(qi+1>=N){qi++;return ask()}
 const a=door.getBoundingClientRect(),r=room.getBoundingClientRect();room.style.transformOrigin=(a.left+a.width/2-r.left)+"px "+(a.top+a.height/2-r.top)+"px";room.classList.add("walk");
 setTimeout(()=>{room.classList.remove("walk");room.classList.add("arrive");qi++;ask();scrollTo(0,0);setTimeout(()=>room.classList.remove("arrive"),900)},1000)}
function fin(){$("#game").hidden=true;$("#reg").hidden=true;$("#end").hidden=false;$("#end").innerHTML=`<h2 style="color:#2b1a00">🔑 ¡Expediente abierto!</h2><p>${esc(me.name)}, cruzaste las ${N} puertas con <b>${me.score} puntos</b>.</p><button id="lb">Ver clasificación</button>`;$("#lb").onclick=()=>view("board")}
function paint(){const s=[...rows].sort((a,b)=>(b.level||0)-(a.level||0)||(b.score||0)-(a.score||0)||(a.t||0)-(b.t||0));
 $("#board").innerHTML=!db?'<p class="mut" style="text-align:center">La clasificación no está disponible en este modo.</p>':'<h2 class="t">🏆 Clasificación</h2>'+(s.length?s.slice(0,30).map((p,i)=>`<div class="row${p.id===uid?" me":""}"><b>${["🥇","🥈","🥉"][i]||i+1}</b><span class="nm">${esc(p.name||"?")}</span><span class="pr"><i style="width:${(p.level||0)/N*100}%"></i></span><em>${p.level||0}/${N} · ${p.score||0} pts</em></div>`).join(""):'<p class="mut" style="text-align:center">Aún no hay jugadores.</p>');
 if(owner)$("#admin").innerHTML=`<h2 class="t">🗝️ Panel del administrador</h2><p class="mut" style="text-align:center">Solo tú ves esta tabla. ${rows.length} participante(s) registrados.</p><div class="wrap"><table><tr><th>Nombre</th><th>Reto</th><th>Puntos</th><th>Último avance</th><th></th></tr>${s.map(p=>`<tr><td>${esc(p.name||"?")}</td><td>${p.level||0}/${N}</td><td>${p.score||0}</td><td>${p.t?new Date(p.t).toLocaleString("es-CO"):""}</td><td><button class="btn" data-d="${esc(p.id)}">Eliminar</button></td></tr>`).join("")}</table></div><p style="text-align:center"><button id="clr">${sure?"¿Seguro? Clic otra vez para vaciar todo":"Vaciar clasificación"}</button></p>`}
$("#admin").onclick=async e=>{if(!db||!owner)return;const d=e.target.closest("[data-d]");
 if(d){try{await db.doc("players/"+d.dataset.d).delete()}catch(x){}return}
 if(e.target.id==="clr"){if(!sure){sure=true;paint();return}sure=false;for(const p of rows){try{await db.doc("players/"+p.id).delete()}catch(x){}}}};
(async()=>{try{const c=window.claude;if(c){const u=await c.use("user");if(u){uid=await u.id();owner=await u.isOwner()}db=uid?await c.use("db"):null}}catch(e){db=null}
 if(db){try{const s=await db.doc("players/"+uid).get();if(s.exists){me={...me,...s.data()};$("#nm").value=me.name||"";if(me.level)$("#msg").textContent=me.level>=N?"Ya abriste el expediente.":"Tienes avance guardado: continuarás en el reto "+(me.level+1)+"."}
  db.collection("players").onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));paint()},()=>{})}catch(e){}}
 if(!db)$("#msg").textContent="Esta versión se juega sin clasificación.";$("#tAdmin").hidden=!owner;paint()})();
</script></body></html>
